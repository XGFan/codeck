[package]
name = "codeck-host"
description = "CoDeck Host: the runtime around codeck_core::Engine (worker, watcher, settings, ccrpc) and the method table, without tauri; and the headless daemon `codeck-host` that serves it over HTTP + WebSocket on the LAN (ADR-0011)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
codeck-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
ureq.workspace = true
base64.workspace = true
chrono.workspace = true
libc.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net", "macros", "rt", "rt-multi-thread", "signal"] }
tower-http = { workspace = true, features = ["fs", "set-header"] }
# Only the daemon (src/bin/codeck-host.rs) uses these two.
tracing-subscriber.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
