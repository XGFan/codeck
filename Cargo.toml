[package]
name = "ccrpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
toh-proto = { git = "ssh://git@github.com/XGFan/toh.git", branch = "master" }
cv-core = { git = "ssh://git@github.com/XGFan/claude-code-viewer.git", branch = "main" }
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
