name: CoDeck
options:
  bundleIdPrefix: dev.joy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CoDeck:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: CoDeck/Info.plist
      properties:
        CFBundleDisplayName: CoDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: CoDeck 经局域网连接 Host，浏览其中的 Session。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joy.codeck.ios
        PRODUCT_NAME: CoDeck
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    dependencies:
      - sdk: WebKit.framework
  CoDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CoDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joy.codeck.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CoDeck.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CoDeck
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  CoDeck:
    build:
      targets:
        CoDeck: all
        CoDeckTests: [test]
    test:
      targets:
        - CoDeckTests
